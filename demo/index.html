<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>json-differ Playground</title>

    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>


    <link rel="stylesheet" href="./css/playground.css">
</head>

<body>
<main class="page">
    <header>
        <h1>json-differ Playground</h1>
        <p class="subtitle">
            Compare JSON directly in your browser using the real json-differ Java library.
        </p>
    </header>

    <section class="editors">
        <article class="card">
            <div class="card-header">
                <h2 class="card-title">Expected JSON</h2>
                <button class="secondary-button" id="formatExpected" type="button">
                    Format
                </button>
            </div>

            <textarea id="expected" spellcheck="false">{
  "name": "Alice",
  "age": 30,
  "active": true
}</textarea>
        </article>

        <article class="card">
            <div class="card-header">
                <h2 class="card-title">Actual JSON</h2>
                <button class="secondary-button" id="formatActual" type="button">
                    Format
                </button>
            </div>

            <textarea id="actual" spellcheck="false">{
  "name": "Bob",
  "age": 30,
  "active": true
}</textarea>
        </article>
    </section>

    <div class="actions">
        <button class="primary-button" id="compare" type="button" disabled>
            Compare
        </button>
    </div>

    <p class="status" id="status">Starting browser Java runtime...</p>

    <section class="card result-card">
        <div class="card-header">
            <h2 class="card-title">Comparison Result</h2>
        </div>

        <pre class="result" id="result">Waiting for comparison...</pre>
    </section>

    <p class="footer-note">
        Comparison runs locally in your browser. JSON is not sent to a server.
    </p>
</main>

<script type="module" src="./js/playground.js"></script>
</body>
</html>
