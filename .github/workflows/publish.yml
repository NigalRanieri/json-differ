name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Ensure workflow is running from a tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Publishing is allowed only from a Git tag."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Validate tag format and POM version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the format vX.Y.Z, for example v1.0.0."
            exit 1
          fi

          TAG_VERSION="${TAG#v}"

          POM_VERSION="$(
            mvn help:evaluate \
              -Dexpression=project.version \
              -q \
              -DforceStdout
          )"

          echo "Tag version: ${TAG_VERSION}"
          echo "POM version: ${POM_VERSION}"

          if [[ "${POM_VERSION}" == *-SNAPSHOT ]]; then
            echo "Snapshot versions cannot be published by this workflow."
            exit 1
          fi

          if [[ "${TAG_VERSION}" != "${POM_VERSION}" ]]; then
            echo "Tag version does not match pom.xml."
            exit 1
          fi

      - name: Verify release build
        run: mvn --batch-mode clean verify -Prelease
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish deployment to Maven Central
        run: mvn --batch-mode clean deploy -Prelease
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}