name: Build

on:
  push:
    branches:
      - master
      - feature/**
      - ci/**
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check formatting
        run: mvn --batch-mode spotless:check

      - name: Verify
        run: mvn --batch-mode -Dspotless.skip=true verify

  compatibility:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ['8', '21']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify
        run: mvn --batch-mode verify