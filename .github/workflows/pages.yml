name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - feature/live-demo

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build json-differ
        run: mvn --batch-mode clean package

      - name: Copy runtime dependencies
        run: |
          mkdir -p demo-build/dependencies

          mvn --batch-mode dependency:copy-dependencies \
            -DincludeScope=runtime \
            -DoutputDirectory="${{ github.workspace }}/demo-build/dependencies"

      - name: Compile demo bridge
        run: |
          mkdir -p demo-build/classes

          javac \
            --release 8 \
            -cp target/json-differ-0.2.0-SNAPSHOT.jar \
            -d demo-build/classes \
            demo/bridge/src/io/github/nigalranieri/jsondiffer/demo/DemoBridge.java

      - name: Build browser demo JAR
        run: |
          mkdir -p demo-build/bundle

          cp -R demo-build/classes/. demo-build/bundle/

          unzip -q -o \
            target/json-differ-0.2.0-SNAPSHOT.jar \
            -d demo-build/bundle

          for jarfile in demo-build/dependencies/*.jar; do
            unzip -q -o "$jarfile" -d demo-build/bundle
          done

          rm -f demo-build/bundle/META-INF/*.SF
          rm -f demo-build/bundle/META-INF/*.RSA
          rm -f demo-build/bundle/META-INF/*.DSA

          jar cf demo-build/json-differ-demo.jar \
            -C demo-build/bundle .

      - name: Generate Javadocs
        run: mvn --batch-mode javadoc:javadoc

      - name: Assemble site
        run: |
          mkdir -p site/apidocs
          mkdir -p site/demo

          cp -R docs/. site/
          cp -R target/reports/apidocs/. site/apidocs/

          cp demo/index.html site/demo/index.html
          cp demo-build/json-differ-demo.jar site/demo/json-differ-demo.jar

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4